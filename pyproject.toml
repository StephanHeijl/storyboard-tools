[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "storyboardctl"
version = "0.1.0"
description = "Agent-facing, versioned storyboard and ComfyUI production tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Storyboard Tools contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
storyboardctl = "storyboardctl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/storyboardctl"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/storyboardctl/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["storyboardctl"]
